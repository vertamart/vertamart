name: Build Vertamart (Android APK)

# Compila el APK de Android en el runner de GitHub (trae Android SDK) y publica
# una Release descargable por cualquiera.
# - El instalador de Windows se sube aparte (se compila localmente en Windows).
# - Se lanza al crear un tag v* o manualmente desde la pestaña Actions.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build the web
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Generate app icons
        run: node build/generate-icons.cjs
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build debug APK (chmod gradlew)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Vertamart-v${VERSION}.apk"
      - name: Create GitHub Release (APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vertamart ${{ github.ref_name }}
          files: Vertamart-*.apk
          generate_release_notes: true